name: Watchdocs Sync

on:
  push:
    branches:
      - main
    paths:
      - "src/routes/**"
      - "src/controllers/**"
      - "openapi.yaml"
      - "openapi.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-docs:
    # Prevent bot from triggering itself in an infinite loop
    if: "!contains(github.event.head_commit.author.name, 'watchdocs')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch previous commit for accurate git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Watchdocs Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/watchdocs-engine.ts
